[package]
name = "clpcat"
version = "0.1.0"
edition = "2021"
description = "A clapping cat that dances in your terminal to mock your typos"
license = "MIT"
repository = "https://github.com/paleblue-2032/clappingcat_on_terminal"
readme = "README.md"
keywords = ["cli", "ascii-art", "terminal", "meme"]
categories = ["command-line-utilities"]

[[bin]]
name = "clpcat"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
unicode-width = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
